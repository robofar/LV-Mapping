setting:
  name: "test_cka_pepper"
  output_root: "./experiments"
  color_channel: 3
  first_frame_ref: False
process:
  min_range_m: 0.9
  max_range_m: 1.5  # distance filter for each frame
  vox_down_m: 0.003
sampler:
  surface_sample_range_m: 0.02
  surface_sample_n: 3
  free_sample_begin_ratio: 0.8
  free_sample_end_dist_m: 0.1
  free_front_sample_n: 1 # 2
  free_behind_sample_n: 1
neuralpoints:
  voxel_size_m: 0.02
loss:
  sigma_sigmoid_m: 0.01
  ekional_loss_on: True
  weight_e: 0.5
continual: # the data sample pool
  batch_size_new_sample: 2000
  pool_capacity: 1e7
  pool_filter_freq: 10
gs:
  gs_iters: 5
  gs_bs: 2
  gs_keyframe_interval: 2
  img_pool_size: 20
  sh_degree: 1
  gs_down_rate: 1
  gs_vis_down_rate: 1
# tracker:
#   track_on: True
#   photo_loss: True
#   source_vox_down_m: 0.02
#   iter_n: 20
#   lm_lambda: 1e-4 # 0.01
optimizer:
  iters: 10  # iterations per frame
  batch_size: 8000 # 16384 # 8192
  ba_freq_frame: 15
  ba_local_frame: 30
eval:
  wandb_vis_on: False # log to wandb or not
  o3d_vis_on: True # visualize the mapping or not
  mesh_freq_frame: 20 # reconstruct the mesh every x frames
  mesh_min_nn: 25
  mc_res_m: 0.01
  sensor_cad_path: ./cad/camera.ply