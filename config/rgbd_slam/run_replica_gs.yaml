setting:
  name: "test_replica_gs"
  output_root: "./experiments"
  pc_path: "./data/Replica/room0/rgbd_ply"
  pose_path: "./data/Replica/room0/poses.txt"
  color_channel: 3
  first_frame_ref: False
process:
  min_range_m: 0.05
  max_range_m: 6.0
  min_z_m: -10.0
  vox_down_m: 0.015
  estimate_normal: True
sampler:
  surface_sample_range_m: 0.03
  surface_sample_n: 2
  free_sample_begin_ratio: 0.6
  free_sample_end_dist_m: 0.1
  free_front_sample_n: 1
neuralpoints:
  voxel_size_m: 0.03 # 0.04
  query_nn_k: 8
  from_sample_points: False
gs:
  monodepth_on: True
  gs_iters: 10
  gs_bs: 5
  gs_keyframe_interval: 5
  img_pool_size: 30
  gs_down_rate: 1
  gs_vis_down_rate: 1
  sh_degree: 0
  init_opacity: 0.5
  lambda_depth: 1.0
  lambda_distort: 1000.0
  lambda_normal: 0.1 # not too big 0.05 
  lambda_isotropic: 100.0
  lambda_sdf_cons: 1.0
  lambda_sdf_normal_cons: 1.0
  lambda_sdf: 0.0
loss:
  sigma_sigmoid_m: 0.01
  ekional_loss_on: True
  weight_e: 0.5
  numerical_grad_on: True
continual:
  batch_size_new_sample: 2000
  pool_capacity: 3e7
  pool_filter_freq: 10
# tracker:
#   photo_loss: True
#   photo_weight: 0.01
#   eigenvalue_check: False
#   source_vox_down_m: 0.06
#   iter_n: 50
#   min_grad_norm: 0.4
#   max_grad_norm: 2.5
#   GM_grad: 0.3
#   GM_dist: 0.05
#   term_deg: 1e-3
#   term_m: 1e-4
optimizer:
  iters: 20 # you need more iterations for achieveing a nice mesh # 50
  batch_size: 16384
  ba_freq_frame: 20
  lr_pose_ba: 1e-3
eval:
  mesh_freq_frame: 5 # reconstruct the mesh every x frames
  mesh_min_nn: 9
  sensor_cad_path: ./cad/camera.ply
  skip_top_voxel: 3