setting:
  name: "test_tum"
  output_root: "./experiments"
  # select from freiburg1_desk, freiburg2_xyz, freiburg3_office
  color_channel: 3
  first_frame_ref: False
  begin_frame: 0
  end_frame: 5000
  step_frame: 1 # 1 means does not skip
process:
  min_range_m: 0.05
  max_range_m: 3.0  # distance filter for each frame
  min_z_m: -10.0 
  vox_down_m: 0.01 # TODO
sampler:
  surface_sample_range_m: 0.03
  surface_sample_n: 4 # 4
  free_sample_begin_ratio: 0.5
  free_sample_end_dist_m: 0.1 # 1.0
  free_front_sample_n: 1
  free_behind_sample_n: 0
neuralpoints:
  voxel_size_m: 0.03
  feature_dim: 8
  query_nn_k: 6
  search_alpha: 0.8
  weighted_first: True # TODO
decoder:
  mlp_level: 1
  mlp_hidden_dim: 64
  freeze_after_frame: 40
loss:
  sigma_sigmoid_m: 0.005
  loss_weight_on: True # False
  dist_weight_scale: 0.6
  behind_dropoff_on: True
  ekional_loss_on: True
  weight_e: 0.2 # TODO 0.5
continual: # the data sample pool
  batch_size_new_sample: 4000 # don't split current and history
  pool_capacity: 2e7
tracker:
  uniform_motion_on: True
  photo_loss: True
  photo_weight: 0.1
  source_vox_down_m: 0.02
  iter_n: 50
  min_grad_norm: 0.5 # 0.5
  max_grad_norm: 2.0 # 2.0
  GM_grad: 0.4 # TODO
  GM_dist: 0.05
  eigenvalue_check: False
optimizer:
  mapping_freq_frame: 2
  iters: 20  # iterations per frame
  batch_size: 16384 # 16384 # 16384 # 8192
  ba_freq_frame: 20
  lr_pose_ba: 1e-3
  # you need to train more iterations, lots of the samples are not even learned --> this cause the roughness of the reconstruction
eval:
  mesh_freq_frame: 50 # reconstruct the mesh every x frames
  mesh_min_nn: 9
  sensor_cad_path: ./cad/camera.ply
  skip_top_voxel: 5