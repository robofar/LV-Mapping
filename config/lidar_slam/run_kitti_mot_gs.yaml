setting: 
  name: "test_kitti_mot_gs"
  output_root: "./experiments"
  deskew: True
  kitti_correct: True
  correct_deg: 0.195
  color_channel: 3
  color_map_on: True 
process:
  max_range_m: 80.0 # 80.0
  vox_down_m: 0.05
  estimate_normal: False
sampler:
  surface_sample_range_m: 0.15 
  surface_sample_n: 5
  free_sample_begin_ratio: 0.3
  free_sample_end_dist_m: 1.0
  free_front_sample_n: 2
neuralpoints:
  voxel_size_m: 0.25
  search_alpha: 0.8
  query_nn_k: 8
loss:
  sigma_sigmoid_m: 0.08
  # loss_weight_on: True
  # dist_weight_scale: 0.8
  ekional_loss_on: True
  weight_e: 0.5
