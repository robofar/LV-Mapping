continual:
  batch_size_new_sample: 3000
  pool_capacity: 1e7
  pool_filter_freq: 10
# tracker:
#   photo_loss: False
#   source_vox_down_m: 0.6
#   iter_n: 50
pgo:
  map_context: True
  pgo_freq_frame: 30
  context_cosdist: 0.3
  virtual_side_count: 10
  local_loop_dist_thre: 15.0
optimizer: # mappers 
  batch_size: 16384
  iters: 15 # i don't know how # TODO
eval:
  mesh_freq_frame: 10 # reconstruct the mesh every x frames
  mesh_min_nn: 12
  sensor_cad_path: ./cad/kitti_car.ply