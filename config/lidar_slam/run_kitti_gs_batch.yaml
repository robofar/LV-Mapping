setting: 
  name: "test_kitti_gs"
  output_root: "./experiments"
  color_channel: 3
  deskew: False
  kitti_correct: True
  correct_deg: 0.195
  color_map_on: True 
process:
  max_range_m: 80.0 # 80.0
  min_range_m: 3.0
  min_z_m: -3.5
  vox_down_m: 0.05
  estimate_normal: False
sampler:
  surface_sample_range_m: 0.25
neuralpoints:
  voxel_size_m: 0.2 # 0.5
  search_alpha: 0.5
gs:
  monodepth_on: True
  gs_iters: 5000
  gs_bs: 10
  gs_keyframe_interval: 1
  img_pool_size: 50
  gs_down_rate: 0
  gs_vis_down_rate: 0
  sh_degree: 1
  gs_batch_training_on: True
  gs_batch_frame: 50
continual:
  batch_size_new_sample: 1000
  pool_capacity: 1e7
  pool_filter_freq: 10
tracker:
  photo_loss: False
  source_vox_down_m: 1.2
  iter_n: 20
  term_deg: 0.1
pgo:
  map_context: True
  pgo_freq_frame: 30
  context_cosdist: 0.3
  virtual_side_count: 10
  local_loop_dist_thre: 15.0
optimizer: # mappers 
  batch_size: 8000
  adaptive_iters: True
eval:
  mesh_freq_frame: 10 # reconstruct the mesh every x frames
  mesh_min_nn: 9
  sensor_cad_path: ./cad/kitti_car.ply