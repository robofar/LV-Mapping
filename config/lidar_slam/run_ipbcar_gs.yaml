setting:
  name: "test_ipbcar_gs"
  output_root: "./experiments"
  deskew: True
  deskew_ref_ratio: 0.35 # according to the camera/lidar timestamp # FIXME
  color_channel: 3
  color_map_on: True
process:
  min_range_m: 2.5
  max_range_m: 60.0
  vox_down_m: 0.10
  estimate_normal: False
sampler:
  surface_sample_range_m: 0.3
  surface_sample_n: 2
  free_sample_begin_ratio: 0.2
  free_sample_end_dist_m: 1.0
  free_front_sample_n: 3
neuralpoints:
  voxel_size_m: 0.3
  search_alpha: 0.5
  query_nn_k: 6
  feature_dim: 32 # 32
  color_feature_dim: 16 # 16
  weighted_first: False
  # map_surface_ratio: 1.0 # x surface_sample_range_m would be added to the map 
decoder:
  freeze_after_frame: 40
loss:
  sigma_sigmoid_m: 0.1
  loss_weight_on: True
  dist_weight_scale: 0.8
  ekional_loss_on: True
  weight_e: 0.5
continual:
  batch_size_new_sample: 1000
  pool_capacity: 1e7 # this is often the part that takes a lot of memory
tracker:
  source_vox_down_m: 0.6
  iter_n: 50
pgo:
  map_context: True
  pgo_freq_frame: 30
  virtual_side_count: 6
gs:
  monodepth_on: False
  exposure_correction_on: True
  view_concat_on: True
  dist_concat_on: False
  gs_iters: 50 # 50
  gaussian_bs_ratio: 2.0
  gs_keyframe_interval: 2
  img_pool_size: 48 # TODO
  gs_down_rate: 1
  gs_vis_down_rate: 0
  inverse_depth_loss: True
  lambda_depth: 20.0 # 20.0
  lambda_opacity: 1e-3 # 1e-3 # increase to have more valid gaussians
  # lambda_area: 1e-4 # 1e-3
  lambda_mono_normal: 0.01
  lambda_normal_depth: 0.05 # check this
  consist_normal_fixed: True
  lambda_sdf_cons: 0.2
  lambda_sdf_normal_cons: 0.2 # rendered normal seems to be better without this loss
  lambda_sdf: 1.0 # 0.1 # what should this value be like
optimizer: # mapper
  iters: 15  # iterations per frame
  batch_size: 8192
eval:
  o3d_vis_on: True # if false, mesh vis is also disabled
  sensor_cad_path: ./cad/ipb_car_cheap.ply
  mesh_freq_frame: 10 # reconstruct the mesh every x frames
  mesh_min_nn: 15