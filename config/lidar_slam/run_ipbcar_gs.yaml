setting:
  name: "test_ipbcar_gs_ours"
  output_root: "./pings_experiments"
  deskew: True
  deskew_ref_ratio: 0.33
  color_channel: 3
  color_map_on: True
  begin_frame: 20 # 0 for static map creation
  end_frame: 30 # 400 for static map creation
process:
  min_range_m: 1.5
  max_range_m: 60.0
  vox_down_m: 0.08
  dynamic_sdf_ratio_thre: 0.6
sampler:
  surface_sample_range_m: 0.3
  surface_sample_n: 6
  free_sample_begin_ratio: 0.3
  free_front_sample_n: 2
neuralpoints:
  voxel_size_m: 0.25 # 0.25
  search_alpha: 0.8 # 0.8
  query_nn_k: 8 # 
  feature_dim: 32 # 32 
  color_feature_dim: 16 # 16
  weighted_first: True # not much difference True or False
  temporal_local_map_off: True
decoder:
  freeze_after_frame: 30 # 30 # 50 tried # 100, 150 has problem when evaluation, double backpro, figure out why
  freeze_after_iter_sdf: 2200
  freeze_after_iter_gaussians: 4200
  gs_mlp_level: 1 # 2?, not much improvement
  gs_mlp_hidden_dim: 128 # 128
loss:
  sigma_sigmoid_m: 0.05 # the smaller, we care more about the part very close to the surface
  weight_color: 0.2
  ekional_loss_on: True
  numerical_grad: False # FIXME
  weight_e: 0.1 # 1.0 # not much differences # better 1.0 ? 0.5 # TODO # try 0.1
continual:
  batch_size_new_sample: 1000
  pool_capacity: 1e7 # this is often the part that takes a lot of memory # better to increase this
  use_local_pool_sdf: False
# when test a mapping mode, comment out the tracker and pgo 
tracker_x:
  source_vox_down_m: 0.6
  iter_n: 100
pgo_x:
  map_context: True
  pgo_freq_frame: 30
  virtual_side_count: 6
gs:
  gs_type: gaussian_surfel # 3d_gs, 2d_gs, gaussian_surfel
  exposure_correction_on: True # verified to be better than False
  affine_exposure_correction: True 
  cam_pose_train_on: False
  eval_cam_refine_on: False # True
  view_concat_on: True
  dist_concat_on: False
  n_gaussian: 8 # not worth to increase it, a little improvement #
  gs_iters: 50
  gaussian_bs_ratio: 2.0
  img_pool_size: 60 # TODO
  long_term_img_pool_size: 120
  long_term_train_down: False
  short_term_train_prob: 0.5 # 0.5 is best
  gs_down_rate: 0 # delete
  gs_vis_down_rate: 0 # delete
  gs_keyframe_accu_dist: 1.0 # unit: m
  # inverse_depth_loss: True
  # lambda_depth: 5.0
  inverse_depth_loss: False
  lambda_depth: 0.01
  lambda_opacity: 2e-3 # 1e-3 # increase to have more valid Gaussians
  # lambda_invalid_opacity: 1e-3 # TODO
  lambda_area: 1e-3 # 2e-4 # 1e-3 # test turning on this (TODO)
  # consist_normal_fixed: True # TODO
  lambda_normal_depth: 0.01 # # better to be off
  consist_shift_count: 0 # not for ipb car set, on for oxford
  lambda_sdf_cons: 0.02 # 0.05
  lambda_sdf_normal_cons: 0.02 # 0.05
  lambda_sdf: 0.5 # 0.5 # what should this value be like # I don't know # 1.0
  min_alpha: 0.05 # TODO # 0.05
  # displacement_range_ratio: 5.0 
  # max_scale_ratio: 5.0
  # unit_scale_ratio: 0.5
  invalid_check_on: False # when True there is no much difference, so leave it as False (*)
optimizer: # mapper
  iters: 15  # iterations per frame
  batch_size: 8192
  learning_rate_geo: 2e-3 # 0.01 (not good) # neural point geo feature lr # 0.002 # 0.005 geometry a bit worse but rendering is a bit better
  learning_rate_color: 2e-3 # 0.01 (not good) # neural point color feature lr # 0.2
  learning_rate_exposure: 1e-3
  learning_rate_cam_dr: 3e-3
  learning_rate_cam_dt: 1e-3
eval:
  o3d_vis_on: True # if false, mesh vis is also disabled
  gs_eval_on: True
  # rendered_pc_eval_on: True
  sensor_cad_path: ./cad/ipb_car_cheap.ply
  mesh_freq_frame: 10 # reconstruct the mesh every x frames
  mesh_min_nn: 15
  visualizer_split_width_ratio: 0.6