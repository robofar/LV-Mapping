setting:
  name: "test_ipbcar_gs_ours"
  output_root: "./pings_experiments"
  deskew: True
  color_channel: 3
  color_map_on: True
process:
  min_range_m: 1.5
  max_range_m: 60.0
  vox_down_m: 0.08
  dynamic_sdf_ratio_thre: 0.6
sampler:
  surface_sample_range_m: 0.4
  surface_sample_n: 6
  free_sample_begin_ratio: 0.3
  free_front_sample_n: 2
neuralpoints:
  voxel_size_m: 0.25 # 0.25
  search_alpha: 0.8 # 0.8
  query_nn_k: 6 # 6 # changed
  feature_dim: 32 # 32 # not worth further improving this
  color_feature_dim: 32 # 16
  weighted_first: False # not much difference True or False 
decoder:
  freeze_after_frame: 30 # 30
  gs_mlp_level: 1 # 2?, not much improvement
  gs_mlp_hidden_dim: 128
loss:
  sigma_sigmoid_m: 0.05 # the smaller, we care more about the part very close to the surface
  weight_color: 0.2
  # loss_weight_on: True
  # dist_weight_scale: 0.8
  ekional_loss_on: True
  numerical_grad: False # FIXME
  weight_e: 0.5 # 1.0 # not much differences # better 1.0 ? 0.5 # TODO
continual:
  batch_size_new_sample: 1000
  pool_capacity: 2e7 # this is often the part that takes a lot of memory # better to increase this
  pool_filter_freq: 5
# now test a mapping mode
tracker:
  source_vox_down_m: 0.6
  iter_n: 50
pgo:
  map_context: True
  pgo_freq_frame: 30
  virtual_side_count: 6
gs:
  gs_type: gaussian_surfel # gaussian_surfel # 3d_gs, 2d_gs, gaussian_surfel
  exposure_correction_on: True # verified to be better than False
  view_concat_on: True
  n_gaussian: 8 # not worth to increase it, a little improvement #
  gs_iters: 100 # 50 # 100
  gaussian_bs_ratio: 2.0 # 2.0 # TODO: decrease maybe
  img_pool_size: 60 # TODO
  long_term_img_pool_size: 120
  long_term_train_down: False
  short_term_train_prob: 0.6
  gs_down_rate: 1
  gs_vis_down_rate: 1
  gs_keyframe_accu_dist: 1.0 # unit: m
  inverse_depth_loss: False
  lambda_depth: 0.01 # 0.02
  lambda_opacity: 2e-3 # 1e-3 # 2e-3 # increase to have more valid gaussians
  # lambda_opacity_ent: 1e-3
  lambda_invalid_opacity: 2e-3 # TODO
  lambda_area: 2e-4 # 1e-3 # test turning on this (TODO)
  # consist_normal_fixed: True
  lambda_normal_depth: 0.01 #
  lambda_sdf_cons: 0.01 # the weight do not need to be very large
  lambda_sdf_normal_cons: 0.01 # the weight do not need to be very large # TODO
  lambda_sdf: 0.5 # 0.1 # what should this value be like # I don't know # 1.0
  min_alpha: 0.05
optimizer: # mapper
  iters: 15  # iterations per frame
  batch_size: 8192
  learning_rate_geo: 0.002 # neural point geo feature lr # 0.002 0.005 geometry a bit worse but rendering is a bit better
  learning_rate_color: 0.002 # neural point color feature lr
  learning_rate_exposure: 1e-3 # or 1e-3
eval:
  o3d_vis_on: True # if false, mesh vis is also disabled
  sensor_cad_path: ./cad/ipb_car_cheap.ply
  mesh_freq_frame: 10 # reconstruct the mesh every x frames
  mesh_min_nn: 18
  visualizer_split_width_ratio: 0.6