setting: 
  name: "test_vkitti_gs"
  output_root: "./experiments"
  color_channel: 3
  color_map_on: True
process:
  max_range_m: 80.0 # 80.0
  vox_down_m: 0.05
  estimate_normal: False
sampler:
  surface_sample_range_m: 0.2 
  surface_sample_n: 4
  free_sample_begin_ratio: 0.3
  free_sample_end_dist_m: 1.0
  free_front_sample_n: 2
neuralpoints:
  voxel_size_m: 0.15 # 0.5
  search_alpha: 0.8
gs:
  monodepth_on: False
  gs_iters: 10 # 20
  gs_bs: 5 # 5 # train more
  gaussian_bs_ratio: 4.0
  gs_keyframe_interval: 2 # 2
  img_pool_size: 25 # 15
  img_test_pool_size: 15
  gs_down_rate: 1
  gs_vis_down_rate: 1
  init_opacity: 0.5
  sh_degree: 0 # According to experiments, it seems to not play an important role, but why
  inverse_depth_loss: False
  lambda_depth: 10.0 # 10.0
  lambda_distort: 100.0 # 100.0
  # lambda_normal: 0.1 # not too big 0.05 
  # lambda_isotropic: 1.0 
  # lambda_sky: 0.01 # not much impact
  lambda_sdf_cons: 1.0
  lambda_sdf_normal_cons: 1.0 # rendered normal seems to be better without this loss
  lambda_sdf: 0.0
  gs_rotation_lr: 1e-2
continual:
  batch_size_new_sample: 2000
  pool_capacity: 1e7
  pool_filter_freq: 10
# tracker:
#   photo_loss: False
#   source_vox_down_m: 0.6
#   iter_n: 50
pgo:
  map_context: True
  pgo_freq_frame: 30
  context_cosdist: 0.3
  virtual_side_count: 10
  local_loop_dist_thre: 15.0
optimizer: # mappers 
  batch_size: 16384
  adaptive_iters: True
eval:
  mesh_freq_frame: 10 # reconstruct the mesh every x frames
  mesh_min_nn: 15